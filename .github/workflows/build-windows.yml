name: Build Windows app

# Manual only — this produces a downloadable .exe installer, not a
# push/PR check, so it shouldn't run automatically on every commit and burn
# CI minutes for no reason. Trigger it from the Actions tab when you actually
# want a fresh build.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./financehub.db"

      - name: Build the Windows installer
        run: npm run electron:dist:win
        env:
          DATABASE_URL: "file:./financehub.db"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FinanceHub-windows-installer
          path: release/*.exe
          if-no-files-found: error
