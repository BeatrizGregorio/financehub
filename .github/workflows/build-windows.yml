name: Build Windows app

# Manual only — this produces a downloadable .exe installer, not a
# push/PR check, so it shouldn't run automatically on every commit and burn
# CI minutes for no reason. Trigger it from the Actions tab when you actually
# want a fresh build.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./financehub.db"

      # `next build` prerenders /_not-found, which renders the root layout
      # (it wraps every route) — and the layout queries prisma.entry for the
      # sidebar's current-month summary. Without an actual migrated database
      # on disk, that query fails with "table Entry does not exist" and the
      # whole build aborts. `prisma generate` alone only creates the client
      # code, not the database tables, so this step is required before the
      # build step, not optional.
      - name: Set up the database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "file:./financehub.db"

      - name: Build the Windows installer
        run: npm run electron:dist:win
        env:
          DATABASE_URL: "file:./financehub.db"

      # Catches the exact bug that shipped a broken build to a real user:
      # the native SQLite module loading fine before packaging didn't mean it
      # still loaded correctly after electron-builder's afterPack copy step.
      # This dlopens every copy in the actual packaged output under the
      # actual packaged Electron executable, so a packaging regression fails
      # CI instead of only surfacing when someone launches the installed app.
      - name: Verify packaged native module
        run: node scripts/verify-packaged-native-module.js

      # The step above can only check the binaries it finds — it cannot see one
      # that is missing. A build shipped with .next/node_modules/
      # better-sqlite3-<hash>/ containing no binary at all: the scan found the
      # other copy, passed, and every page in the installed app answered 500 on
      # its first database query. The server still started, so the app's own
      # startup check was satisfied too. Actually requesting a page is the only
      # thing that catches it.
      - name: Smoke-test the packaged app
        run: node scripts/smoke-test-packaged-app.js
        env:
          DATABASE_URL: "file:./financehub.db"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FinanceHub-windows-installer
          path: release/*.exe
          if-no-files-found: error
