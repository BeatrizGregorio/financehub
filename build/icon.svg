<!--
  The desktop app's icon: the same mark as the sidebar logo in Nav.tsx — a
  rounded square carrying the brand gradient, with lucide's ChartPie glyph in
  white. Kept as SVG so it can be re-rendered at any size; build/icon.ico and
  build/icon.png are generated from this file (see scripts/make-icons.js).

  The green is the DEFAULT brand colour, not whichever accent is selected in
  Settings: an app icon is baked into the executable at build time and can't
  follow a setting that changes at runtime.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- linear-gradient(135deg, …) in CSS is top-left to bottom-right. -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c9e57"/>
      <stop offset="1" stop-color="#0a7a43"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="143" ry="143" fill="url(#brand)"/>

  <!--
    lucide ChartPie, drawn on a 24x24 grid. Scaled to 52% of the canvas and
    centred: 512 * 0.52 / 24 = 11.093, offset (512 - 266.24) / 2 = 122.88.
    Stroke 2.5 rather than lucide's 2 so the glyph still reads at 16px.
  -->
  <g transform="translate(122.88 122.88) scale(11.093)"
     fill="none" stroke="#ffffff" stroke-width="2.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12c.552 0 1.005-.449.95-.998a10 10 0 0 0-8.953-8.951c-.55-.055-.998.398-.998.95v8a1 1 0 0 0 1 1z"/>
    <path d="M21.21 15.89A10 10 0 1 1 8 2.83"/>
  </g>
</svg>
